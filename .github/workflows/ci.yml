name: Python CI
on:
  push:
  pull_request:
jobs:
  test:
    name: test (${{ matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.10', '3.12', '3.13']
        include:
          - {os: windows-latest, python-version: '3.10'}
          - {os: windows-latest, python-version: '3.13'}
          - {os: macos-latest, python-version: '3.10'}
          - {os: macos-latest, python-version: '3.13'}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v

  quality:
    name: lint and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . ruff coverage
      - run: ruff check .
      - run: coverage run -m unittest discover -s tests
      - run: coverage report --fail-under=80

  windows-installer:
    name: windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade build
      - run: python -m build --wheel
      # Windows PowerShell 5.1 ("powershell"), the one every Windows has, not PowerShell 7.
      - name: Install from the wheel into a temporary folder
        shell: powershell
        run: |
          $wheel = (Get-ChildItem dist\*.whl | Select-Object -First 1).FullName
          .\scripts\install-windows.ps1 -Source $wheel -InstallDir "$env:RUNNER_TEMP\rag\app" -StartMenuDir "$env:RUNNER_TEMP\rag\menu" -NoPath -NoPrompt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if (-not (Test-Path "$env:RUNNER_TEMP\rag\menu\Offline RAG.lnk")) { throw 'Start Menu entry missing' }
      - name: The installed program works
        shell: powershell
        run: |
          $exe = "$env:RUNNER_TEMP\rag\app\Scripts\offline-rag.exe"
          $db = "$env:RUNNER_TEMP\rag\index.sqlite3"
          & $exe --db $db ingest demo
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & $exe --db $db search "the" --files
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Uninstall
        shell: powershell
        run: |
          .\scripts\uninstall-windows.ps1 -InstallDir "$env:RUNNER_TEMP\rag\app" -StartMenuDir "$env:RUNNER_TEMP\rag\menu"
          if (Test-Path "$env:RUNNER_TEMP\rag\app") { throw 'Uninstall left the environment behind' }
