[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "offline-rag-kit"
version = "0.1.1"
description = "Privacy-first local document search with PDF citations and optional Ollama answers"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "HugoDelgadoo"}]
maintainers = [{name = "HugoDelgadoo"}]
dependencies = ["PyMuPDF>=1.24.3,<3"]
keywords = ["rag", "search", "privacy", "pdf", "ollama", "local-first"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Text Processing :: Indexing",
]

[project.urls]
Homepage = "https://github.com/HugoDelgadoo/offline-rag-kit"
Issues = "https://github.com/HugoDelgadoo/offline-rag-kit/issues"
Changelog = "https://github.com/HugoDelgadoo/offline-rag-kit/blob/main/CHANGELOG.md"

[project.scripts]
offline-rag = "offline_rag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
